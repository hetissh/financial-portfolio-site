# Checks the public/admin builds and deploys the Cloudflare preview after successful develop pushes.
name: Portfolio checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: 1
      SITE_MODE: preview
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run comments:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run typecheck:admin
      - run: npm run test:unit
      - run: npm run build:vinext
      - run: npm run build
      - run: npx playwright install --with-deps
      - run: npm run test:e2e
      - run: npm run test:admin
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-report
          path: |
            web/playwright-report
            web/playwright-report-admin
          retention-days: 7

  deploy-preview:
    if: github.ref == 'refs/heads/develop'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudflare-preview
    concurrency:
      group: cloudflare-preview
      cancel-in-progress: true
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: 1
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      SITE_URL: ${{ secrets.SITE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
      ADMIN_ORIGIN: ${{ secrets.ADMIN_ORIGIN }}
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Check Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Add CLOUDFLARE_API_TOKEN to the cloudflare-preview GitHub environment." >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Add CLOUDFLARE_ACCOUNT_ID as a variable in the cloudflare-preview GitHub environment." >&2; exit 1; }
          missing=0
          for name in SITE_URL SUPABASE_URL SUPABASE_PUBLISHABLE_KEY SUPABASE_SECRET_KEY RESEND_API_KEY RESEND_FROM_EMAIL ADMIN_ORIGIN; do
            if [ -z "${!name}" ]; then
              echo "Add $name as a secret in the cloudflare-preview GitHub environment." >&2
              missing=1
            fi
          done
          test "$missing" -eq 0
      - name: Build Cloudflare Workers
        run: npm run build:vinext
      - name: Deploy Response Store Worker
        run: npm run deploy:response-store
      - name: Prepare Worker secrets
        run: |
          umask 077
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';

          const required = [
            'SITE_URL',
            'SUPABASE_URL',
            'SUPABASE_PUBLISHABLE_KEY',
            'SUPABASE_SECRET_KEY',
            'RESEND_API_KEY',
            'RESEND_FROM_EMAIL',
            'ADMIN_ORIGIN',
          ];
          const secrets = Object.fromEntries(required.map((name) => [name, process.env[name]]));
          if (process.env.UNSPLASH_ACCESS_KEY) {
            secrets.UNSPLASH_ACCESS_KEY = process.env.UNSPLASH_ACCESS_KEY;
          }
          writeFileSync(`${process.env.RUNNER_TEMP}/portfolio-worker-secrets.json`, JSON.stringify(secrets), {
            flag: 'wx',
            mode: 0o600,
          });
          NODE
      - name: Deploy site Worker
        run: npm run deploy:vinext -- --secrets-file "$RUNNER_TEMP/portfolio-worker-secrets.json"
      - name: Remove temporary Worker secrets
        if: always()
        run: rm -f "$RUNNER_TEMP/portfolio-worker-secrets.json"
