# Checks the public/admin builds and deploys the Cloudflare preview after successful develop pushes.
name: Portfolio checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: 1
      SITE_MODE: preview
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run comments:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run typecheck:admin
      - run: npm run test:unit
      - run: npm run build:vinext
      - run: npm run build
      - run: npx playwright install --with-deps
      - run: npm run test:e2e
      - run: npm run test:admin
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-report
          path: |
            web/playwright-report
            web/playwright-report-admin
          retention-days: 7

  deploy-preview:
    if: github.ref == 'refs/heads/develop'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudflare-preview
    concurrency:
      group: cloudflare-preview
      cancel-in-progress: true
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: 1
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Check Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Add CLOUDFLARE_API_TOKEN to the cloudflare-preview GitHub environment." >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Add CLOUDFLARE_ACCOUNT_ID as a variable in the cloudflare-preview GitHub environment." >&2; exit 1; }
      - name: Build Cloudflare Workers
        run: npm run build:vinext
      - name: Deploy Response Store Worker
        run: npm run deploy:response-store
      - name: Deploy site Worker
        run: npm run deploy:vinext
